<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Construa Retorno sobre Investimento</title>
  <desc id="d">Skill para Claude de estudo de ROI e business case para contas B2B SaaS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#15406A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E6A9E"/>
      <stop offset="1" stop-color="#5FA8E0"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1F8A5B"/>
      <stop offset="1" stop-color="#3CCB86"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3CCB86"/>
    </marker>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
  </g>

  <!-- logo mark: rising bars + growth arrow -->
  <g transform="translate(80,70)">
    <rect x="0" y="0" width="200" height="200" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <rect x="30"  y="120" width="30" height="50"  rx="5" fill="url(#bar)"/>
    <rect x="72"  y="95"  width="30" height="75"  rx="5" fill="url(#bar)"/>
    <rect x="114" y="68"  width="30" height="102" rx="5" fill="url(#bar)"/>
    <path d="M28 108 L84 78 L118 92 L168 38" fill="none" stroke="#3CCB86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head)"/>
    <line x1="24" y1="178" x2="176" y2="178" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="330" y="138" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Construa Retorno</text>
    <text x="330" y="204" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">sobre <tspan fill="#3CCB86">Investimento</tspan></text>
    <text x="332" y="246" font-size="21" fill="#B9CCE0">Skill para Claude · estudo de ROI e business case para contas B2B SaaS</text>
  </g>

  <!-- tags -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="332" y="268" width="112" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#5FA8E0" stroke-opacity="0.6"/>
    <text x="388" y="289" text-anchor="middle" fill="#D6E6F5">Renovação</text>
    <rect x="456" y="268" width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#5FA8E0" stroke-opacity="0.6"/>
    <text x="508" y="289" text-anchor="middle" fill="#D6E6F5">Expansão</text>
    <rect x="572" y="268" width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#5FA8E0" stroke-opacity="0.6"/>
    <text x="642" y="289" text-anchor="middle" fill="#D6E6F5">Business case</text>
    <rect x="724" y="268" width="150" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#5FA8E0" stroke-opacity="0.6"/>
    <text x="799" y="289" text-anchor="middle" fill="#D6E6F5">Deck executivo</text>
  </g>
</svg>
